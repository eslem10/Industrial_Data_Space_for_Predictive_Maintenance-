apiVersion: apps/v1
kind: Deployment
metadata:
  name: weights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weights
  template:
    metadata:
      labels:
        app: weights
    spec:
      initContainers:
        - name: prepare-directory
          image: python:3.12-slim
          command: ["sh", "-c", "mkdir -p /artifacts/weights/factory_1 /artifacts/weights/factory_2 /artifacts/weights/factory_3"]
          volumeMounts:
            - name: federated-artifacts
              mountPath: /artifacts
      containers:
        - name: weights
          image: python:3.12-slim
          command: ["python", "-m", "http.server", "8000", "--directory", "/artifacts/weights"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: federated-artifacts
              mountPath: /artifacts
              readOnly: true
      volumes:
        - name: federated-artifacts
          persistentVolumeClaim:
            claimName: federated-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: weights
spec:
  selector:
    app: weights
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edc-provider-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edc-provider-1
  template:
    metadata:
      labels:
        app: edc-provider-1
    spec:
      containers:
        - name: connector
          image: industrial-edc-provider:local
          imagePullPolicy: IfNotPresent
          args: ["-Dedc.fs.config=/config/connector.properties", "-jar", "/app/connector.jar"]
          ports:
            - name: management
              containerPort: 8181
            - name: dsp
              containerPort: 8184
            - name: public
              containerPort: 8185
          readinessProbe:
            tcpSocket:
              port: management
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: edc-provider-f1
---
